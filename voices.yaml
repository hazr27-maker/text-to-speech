# Voice manifest — the contract between callers and the model.
#
# --- voice source (exactly one per entry) --------------------------------
#
# `speaker`     a preset baked into the checkpoint   (Qwen CustomVoice)
# `voice_pack`  a separately downloaded voice file   (Kokoro, Piper)
# `ref_audio`   path to a clip to clone              (Chatterbox, F5)
# (none)        described by `style` text alone      (Qwen VoiceDesign)
#
# Which of these a checkpoint accepts is declared by its backend, so an
# entry the active model can't render is reported by "Reload config"
# (and by `python engine.py check`) rather than mis-synthesised.
#
#   CustomVoice 1.7B presets: Ryan, Aiden (English natives); Vivian,
#   Serena, Uncle_Fu (Chinese); Dylan (Beijing), Eric (Sichuan);
#   Ono_Anna (Japanese); Sohee (Korean).
#   Verify against the live checkpoint with:
#     python engine.py list-speakers
#
# --- other fields --------------------------------------------------------
#
# `gender` (optional) — shown in the picker as "label — gender". The
# model API doesn't expose it, so it is stated here; a voice without it
# simply shows the label.
#
# `model` (optional) — pin this voice to a checkpoint. /speak switches
# to it, and it becomes selectable even if it isn't in TTS_MODELS. Use
# it when a voice only makes sense on one model (a Kokoro voice pack on
# a Qwen checkpoint is nonsense); leave it off to follow the model
# selector, which is what every voice below does.
#
# `language` — every CustomVoice preset can speak any supported language:
#   english, chinese, german, french, spanish, italian, portuguese,
#   russian, japanese, korean (or "auto").
#   Verify with: python engine.py list-languages
#
# `speed` (optional, 0.5–1.5, default 1.0) — pitch-preserving tempo
# applied after synthesis. Pacing can also be steered naturally via the
# style text ("speak slowly and deliberately"). A per-request `speed`
# overrides this default.
#
# `style` — free-text steering. Only families that declare the
# "instruct" capability receive it; elsewhere it is ignored, and left
# out of the cache key so it can't split the cache either.

# --- English -------------------------------------------------------------

- id: narrator_en
  label: "Course Narrator"
  speaker: Ryan
  gender: male
  language: English
  style: "Calm, clear e-learning narrator. Measured pace, warm and authoritative."
  tags: [training, narration]

- id: presenter_en
  label: "Upbeat Presenter"
  speaker: Aiden
  gender: male
  language: English
  style: "Sunny, engaging presenter. Good for module intros and transitions."
  tags: [training, intro]

- id: presenter_en_slow
  label: "Presenter (slow)"
  speaker: Aiden
  gender: male
  language: English
  style: "Speak slowly and deliberately, with clear pauses between phrases. Calm, unhurried presenter."
  speed: 0.9
  tags: [training, intro, slow]

- id: coach_en
  label: "Encouraging Coach"
  speaker: Aiden
  gender: male
  language: English
  style: "Supportive, conversational coach giving feedback and encouragement."
  tags: [training, feedback]

- id: announcer_en
  label: "Ring Announcer"
  speaker: Ryan
  gender: male
  language: English
  style: "Confident, high-energy arena announcer."
  tags: [promo]

